name: Yakit fiyati (gunluk)

on:
  schedule:
    - cron: '17 3 * * *'   # her gün 03:17 UTC = 06:17 İstanbul
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuel-price
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Opet fiyatini al
        run: node scripts/fetch-fuel-price.mjs arac/fuel-price.json
      - name: Degisiklik varsa kaydet
        run: |
          if git diff --quiet -- arac/fuel-price.json; then
            echo "Degisiklik yok"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arac/fuel-price.json
          git commit -m "veri: yakit fiyati"
          git push
