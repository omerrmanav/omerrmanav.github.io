<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ev Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --ink: #17160f;
    --ink-2: #57534a;
    --line: #e2ded3;
    --accent: #a8481f;
    --up: #1f7a45;
    --down: #b02a22;
    --hl: #f9e7dc;
  }
  :root[data-theme="dark"] {
    --bg: #0d0e11;
    --card: #17191d;
    --ink: #f3f2ee;
    --ink-2: #b4b2ab;
    --line: #2a2d33;
    --accent: #f0966a;
    --up: #6fcf95;
    --down: #ee7f78;
    --hl: #33231a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    color: var(--ink);
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    overflow: hidden;
  }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  main {
    height: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Saat */
  .clock { text-align: center; padding: 4px 0 0; }
  .time {
    font-size: clamp(64px, 21vw, 112px);
    font-weight: 300;
    letter-spacing: -0.045em;
    line-height: 1;
  }
  .date { margin-top: 6px; font-size: 17px; font-weight: 500; color: var(--ink-2); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 13px 16px;
    display: flex; flex-direction: column;
  }
  .label {
    font-size: 12.5px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-2); margin-bottom: 9px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .label small { font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 13px; }

  /* Hava */
  .wx-top { display: flex; align-items: center; gap: 12px; }
  .wx-icon { font-size: 46px; line-height: 1; }
  .wx-temp { font-size: 48px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
  .wx-desc { font-size: 15px; font-weight: 500; color: var(--ink-2); margin-top: 4px; }
  .wx-meta { margin-left: auto; text-align: right; font-size: 13.5px; font-weight: 400; color: var(--ink-2); line-height: 1.4; white-space: nowrap; }
  .wx-meta b { color: var(--ink); font-weight: 600; }
  .days { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); }
  .d { text-align: center; flex: 1; }
  .d .dn { font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .d .e { font-size: 24px; margin: 3px 0 2px; line-height: 1.1; }
  .d .hi { font-size: 16px; font-weight: 600; }
  .d .lo { font-size: 13.5px; font-weight: 400; color: var(--ink-2); }
  .d .p { font-size: 11.5px; font-weight: 500; color: var(--accent); height: 14px; }

  /* Namaz */
  .next { font-size: 15px; color: var(--accent); font-weight: 600; text-transform: none; letter-spacing: 0; }
  /* 3 sütun x 2 satır: İmsak-Güneş | Öğle-İkindi | Akşam-Yatsı (sütun sütun dolar) */
  .prayers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, auto); grid-auto-flow: column; gap: 6px; flex: 1; align-content: center; }
  .pr { display: flex; flex-direction: column; align-items: center; padding: 8px 4px 7px; border-radius: 12px; }
  .pr .n { font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .pr .v { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; margin-top: 2px; }
  .pr.on { background: var(--hl); }
  .pr.on .n { color: var(--accent); font-weight: 600; }

  /* Piyasa */
  .mk { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 12px; flex: 1; align-content: center; }
  .m .n { font-size: 14px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
  .m .v { font-size: 23px; font-weight: 600; letter-spacing: -0.02em; margin-top: 2px; }
  .m .c { font-size: 13px; font-weight: 600; margin-left: 4px; }
  .up { color: var(--up); } .down { color: var(--down); }

  .footbar { position: relative; margin-top: auto; text-align: center; min-height: 20px; }
  .foot { font-size: 12px; font-weight: 500; color: var(--ink-2); line-height: 20px; }
  #themeBtn {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-2);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 10px; line-height: 16px; cursor: pointer; user-select: none;
  }
  #themeBtn:active { background: var(--hl); color: var(--accent); }
  #themeBtn:focus, #themeBtn:focus-visible { outline: none; }
  .clock { cursor: pointer; touch-action: manipulation; }
  #toast {
    position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); font-size: 16px; font-weight: 600;
    padding: 9px 20px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .2s; white-space: nowrap; z-index: 10;
  }
  #toast.on { opacity: .94; }
  #themeBtn::after { content: ""; position: absolute; top: -8px; right: -6px; bottom: -8px; left: -6px; }
  .stale { color: var(--down); }

  /* Dikey ekran: tüm ölçüler --u birimine bağlıdır (tasarım yüksekliği ≈215u; küçük ekranda orantılı küçülür). */
  @media (orientation: portrait) {
    :root { --u: min(1vw, calc(var(--vh, 1vh) * 0.465), 5px); }
    main { padding: max(calc(var(--u) * 3.889), env(safe-area-inset-top)) calc(var(--u) * 4.444) max(calc(var(--u) * 3.889), env(safe-area-inset-bottom)); gap: calc(var(--u) * 2.778); }
    /* Saat */
  .clock { padding: calc(var(--u) * 1.111) 0 0; }
    .time { font-size: clamp(calc(var(--u) * 17.778), 21vw, calc(var(--u) * 31.111)); }
    .date { margin-top: calc(var(--u) * 1.667); font-size: calc(var(--u) * 4.722); }
    .card { border-radius: calc(var(--u) * 6.111); padding: calc(var(--u) * 3.611) calc(var(--u) * 4.444); }
    .label { font-size: calc(var(--u) * 3.472); margin-bottom: calc(var(--u) * 2.5); }
    .label small { font-size: calc(var(--u) * 3.611); }
    /* Hava */
  .wx-top { gap: calc(var(--u) * 3.333); }
    .wx-icon { font-size: calc(var(--u) * 12.778); }
    .wx-temp { font-size: calc(var(--u) * 13.333); }
    .wx-desc { font-size: calc(var(--u) * 4.167); margin-top: calc(var(--u) * 1.111); }
    .wx-meta { font-size: calc(var(--u) * 3.75); }
    .days { margin-top: calc(var(--u) * 2.778); padding-top: calc(var(--u) * 2.5); }
    .d .dn { font-size: calc(var(--u) * 3.611); }
    .d .e { font-size: calc(var(--u) * 6.667); margin: calc(var(--u) * 0.833) 0 calc(var(--u) * 0.556); }
    .d .hi { font-size: calc(var(--u) * 4.444); }
    .d .lo { font-size: calc(var(--u) * 3.75); }
    .d .p { font-size: calc(var(--u) * 3.194); height: calc(var(--u) * 3.889); }
    /* Namaz */
  .next { font-size: calc(var(--u) * 4.167); }
    /* 3 sütun x 2 satır: İmsak-Güneş | Öğle-İkindi | Akşam-Yatsı (sütun sütun dolar) */
  .prayers { gap: calc(var(--u) * 1.667); }
    .pr { padding: calc(var(--u) * 2.222) calc(var(--u) * 1.111) calc(var(--u) * 1.944); border-radius: calc(var(--u) * 3.333); }
    .pr .n { font-size: calc(var(--u) * 3.611); }
    .pr .v { font-size: calc(var(--u) * 4.722); margin-top: calc(var(--u) * 0.556); }
    /* Piyasa */
  .mk { gap: calc(var(--u) * 2.5) calc(var(--u) * 3.333); }
    .m .n { font-size: calc(var(--u) * 3.889); }
    .m .v { font-size: calc(var(--u) * 6.389); margin-top: calc(var(--u) * 0.556); }
    .m .c { font-size: calc(var(--u) * 3.611); margin-left: calc(var(--u) * 1.111); }
    .footbar { min-height: calc(var(--u) * 5.556); }
    .foot { font-size: calc(var(--u) * 3.333); line-height: calc(var(--u) * 5.556); }
    #themeBtn { font-size: calc(var(--u) * 3.333); border-radius: calc(var(--u) * 277.5); padding: calc(var(--u) * 0.556) calc(var(--u) * 2.778); line-height: calc(var(--u) * 4.444); }
    #toast { font-size: calc(var(--u) * 4.444); padding: calc(var(--u) * 2.5) calc(var(--u) * 5.556); border-radius: calc(var(--u) * 277.5); }
    #themeBtn::after { top: calc(var(--u) * -2.222); right: calc(var(--u) * -1.667); bottom: calc(var(--u) * -2.222); left: calc(var(--u) * -1.667); }
    .time { font-size: calc(var(--u) * 21); }
    main { max-width: 520px; }
  }

  /* Kısa dikey ekran */

  /* Yatay ekran: iki sütun. Tüm ölçüler tek bir birime (--u) bağlıdır; 640x360'ta 1u = 3,2px.
     --u hem genişliğe hem yüksekliğe göre küçülür, böylece her yatay ekranda orantılı sığar. */
  @media (orientation: landscape) {
    :root { --u: min(0.5vw, calc(var(--vh, 1vh) * 0.9), 5px); }
    main {
      max-width: none;
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(0, 1.3fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "clock wx" "mkt prs" "foot foot";
      gap: calc(var(--u) * 2.5) calc(var(--u) * 3.1);
      padding: max(calc(var(--u) * 2.5), env(safe-area-inset-top)) max(calc(var(--u) * 4.4), env(safe-area-inset-right)) calc(var(--u) * 1.3) max(calc(var(--u) * 4.4), env(safe-area-inset-left));
    }
    .clock { grid-area: clock; display: flex; flex-direction: column; justify-content: center; padding: 0; min-height: 0; min-width: 0; }
    #wx { grid-area: wx; } #prs { grid-area: prs; } #mkt { grid-area: mkt; }
    .footbar { grid-area: foot; margin: 0; min-height: calc(var(--u) * 5.6); }
    .foot { font-size: max(9px, calc(var(--u) * 3.4)); line-height: calc(var(--u) * 5.6); }
    #themeBtn { font-size: max(9px, calc(var(--u) * 3.4)); padding: calc(var(--u) * 0.3) calc(var(--u) * 2.8); line-height: calc(var(--u) * 4.4); }
    .time { font-size: calc(var(--u) * 30); }
    .date { margin-top: calc(var(--u) * 0.6); font-size: max(11px, calc(var(--u) * 5)); }
    .card { padding: calc(var(--u) * 2.8) calc(var(--u) * 4); border-radius: calc(var(--u) * 5); min-height: 0; min-width: 0; overflow: hidden; }
    .label { margin-bottom: calc(var(--u) * 1.9); font-size: max(9px, calc(var(--u) * 3.6)); }
    .label small { font-size: max(9px, calc(var(--u) * 3.75)); }
    .wx-top { gap: calc(var(--u) * 3.1); }
    .wx-icon { font-size: calc(var(--u) * 11.3); }
    .wx-temp { font-size: calc(var(--u) * 11.9); }
    .wx-desc { font-size: max(10px, calc(var(--u) * 4)); margin-top: calc(var(--u) * 0.6); }
    .wx-meta { font-size: max(9.5px, calc(var(--u) * 3.9)); line-height: 1.2; }
    .days { margin-top: calc(var(--u) * 2.2); padding-top: calc(var(--u) * 1.9); }
    .d .dn { font-size: max(9px, calc(var(--u) * 3.75)); }
    .d .e { font-size: calc(var(--u) * 6.2); margin: calc(var(--u) * 0.6) 0 calc(var(--u) * 0.3); }
    .d .hi { font-size: max(10px, calc(var(--u) * 4.7)); }
    .d .lo { font-size: max(9px, calc(var(--u) * 3.9)); }
    .d .p { display: none; }
    .next { font-size: max(10px, calc(var(--u) * 4.4)); }
    .prayers { gap: calc(var(--u) * 1.3) calc(var(--u) * 1.9); }
    .pr { flex-direction: row; justify-content: space-between; align-items: baseline; gap: calc(var(--u) * 1); padding: calc(var(--u) * 2.2) calc(var(--u) * 1.6); }
    .pr .n { font-size: max(9px, calc(var(--u) * 3.9)); }
    .pr .v { font-size: max(10.5px, calc(var(--u) * 5.1)); margin-top: 0; }
    .mk { gap: calc(var(--u) * 0.8) calc(var(--u) * 1.8); align-content: space-around; }
    .m .n { font-size: max(9px, calc(var(--u) * 3.6)); }
    .m .v { font-size: max(12px, calc(var(--u) * 5.8)); margin-top: 0; letter-spacing: -0.03em; }
    .m .c { font-size: max(9px, calc(var(--u) * 3.4)); margin-left: calc(var(--u) * 0.8); }
  }
</style>
</head>
<body>
<main>
  <section class="clock">
    <div class="time num" id="time">--:--</div>
    <div class="date" id="date">&nbsp;</div>
  </section>

  <section class="card" id="wx">
    <div class="label"><span>Hava · Pendik</span><small id="wx-up">Open-Meteo.com</small></div>
    <div class="wx-top">
      <div class="wx-icon" id="wx-icon">·</div>
      <div>
        <div class="wx-temp num" id="wx-temp">--°</div>
        <div class="wx-desc" id="wx-desc"></div>
      </div>
      <div class="wx-meta" id="wx-meta"></div>
    </div>
    <div class="days" id="days"></div>
  </section>

  <section class="card" id="prs">
    <div class="label"><span>Namaz vakitleri</span><span class="next num" id="next"></span></div>
    <div class="prayers" id="prayers"></div>
  </section>

  <section class="card" id="mkt">
    <div class="label"><span>Piyasa</span><small>Truncgil · satış</small></div>
    <div class="mk" id="mk"></div>
  </section>

  <div id="toast" role="status"></div>
  <div class="footbar"><div class="foot num" id="foot"></div><button id="themeBtn" type="button" aria-label="Tema"></button></div>
</main>

<script>
(function () {
  'use strict';
  var TZ = 'Europe/Istanbul';
  var LAT = 40.875, LON = 29.233;   // Pendik

  /* ---------- Tema: açık öncelikli; ?tema=acik | koyu | oto ---------- */
  var params = new URLSearchParams(location.search);
  var THEMES = ['oto', 'acik', 'koyu'];
  var THEME_LABEL = { oto: '◐ Otomatik', acik: '☀ Açık', koyu: '☾ Koyu' };
  function storedTheme() { try { var v = localStorage.getItem('ep_tema'); return THEMES.indexOf(v) >= 0 ? v : null; } catch (e) { return null; } }
  var themePref = storedTheme() || (THEMES.indexOf(params.get('tema')) >= 0 ? params.get('tema') : 'oto');
  function applyTheme() {
    var dark = false;
    if (themePref === 'koyu') dark = true;
    else if (themePref === 'oto') { var h = istParts().h; dark = (h >= 22 || h < 7); }  // gece 22:00–07:00 koyu
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var b = document.getElementById('themeBtn'); if (b) b.textContent = THEME_LABEL[themePref];
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', dark ? '#0d0e11' : '#f5f3ee');
  }

  /* ---------- Yardımcılar ---------- */
  function istParts(d) {
    d = d || new Date();
    var f = new Intl.DateTimeFormat('tr-TR', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
      day: '2-digit', month: '2-digit', year: 'numeric' }).formatToParts(d);
    var o = {}; f.forEach(function (p) { o[p.type] = p.value; });
    return { h: +o.hour, m: +o.minute, d: o.day, mo: o.month, y: o.year };
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function $(id) { return document.getElementById(id); }
  function save(k, v) { try { localStorage.setItem('ep_' + k, JSON.stringify({ t: Date.now(), v: v })); } catch (e) {} }
  function load(k) { try { return JSON.parse(localStorage.getItem('ep_' + k)); } catch (e) { return null; } }
  function getJSON(url) {
    return new Promise(function (res, rej) {
      var ctl = ('AbortController' in window) ? new AbortController() : null;
      var to = setTimeout(function () { if (ctl) ctl.abort(); rej(new Error('timeout')); }, 15000);
      fetch(url, ctl ? { signal: ctl.signal } : {}).then(function (r) {
        clearTimeout(to);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(res, rej);
    });
  }
  var trNum = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var trInt = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 0 });

  /* ---------- Saat & tarih ---------- */
  var lastMin = -1;
  function tick() {
    var p = istParts();
    if (p.m !== lastMin) {
      lastMin = p.m;
      $('time').textContent = pad(p.h) + ':' + pad(p.m);
      $('date').textContent = new Intl.DateTimeFormat('tr-TR', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
      applyTheme();
      renderPrayers();
      if (p.h === 4 && p.m === 0) location.reload();   // günde bir tazele
    }
  }

  /* ---------- Hava ---------- */
  var WX = {
    0: ['☀️', 'Açık'], 1: ['🌤️', 'Çoğunlukla açık'], 2: ['⛅', 'Parçalı bulutlu'], 3: ['☁️', 'Kapalı'],
    45: ['🌫️', 'Sisli'], 48: ['🌫️', 'Kırağılı sis'],
    51: ['🌦️', 'Hafif çise'], 53: ['🌦️', 'Çise'], 55: ['🌧️', 'Yoğun çise'],
    56: ['🌧️', 'Donan çise'], 57: ['🌧️', 'Donan çise'],
    61: ['🌧️', 'Hafif yağmur'], 63: ['🌧️', 'Yağmur'], 65: ['🌧️', 'Kuvvetli yağmur'],
    66: ['🌧️', 'Donan yağmur'], 67: ['🌧️', 'Donan yağmur'],
    71: ['🌨️', 'Hafif kar'], 73: ['🌨️', 'Kar'], 75: ['❄️', 'Yoğun kar'], 77: ['🌨️', 'Kar taneleri'],
    80: ['🌦️', 'Sağanak'], 81: ['🌧️', 'Sağanak'], 82: ['⛈️', 'Şiddetli sağanak'],
    85: ['🌨️', 'Kar sağanağı'], 86: ['🌨️', 'Kar sağanağı'],
    95: ['⛈️', 'Gök gürültülü fırtına'], 96: ['⛈️', 'Dolu'], 99: ['⛈️', 'Şiddetli dolu']
  };
  function wx(code, isDay) {
    var w = WX[code] || ['·', ''];
    if (isDay === 0 && (code === 0 || code === 1)) return ['🌙', w[1]];
    return w;
  }
  function renderWeather(d) {
    if (!d || !d.current || !d.daily) return;
    var c = d.current, w = wx(c.weather_code, c.is_day), dy = d.daily;
    $('wx-icon').textContent = w[0];
    $('wx-temp').textContent = Math.round(c.temperature_2m) + '°';
    $('wx-desc').textContent = w[1];
    $('wx-meta').innerHTML =
      '<div><b class="num">↑' + Math.round(dy.temperature_2m_max[0]) + '°</b> <b class="num">↓' + Math.round(dy.temperature_2m_min[0]) + '°</b></div>' +
      '<div>Hissedilen <b class="num">' + Math.round(c.apparent_temperature) + '°</b></div>' +
      '<div>Nem <b class="num">%' + Math.round(c.relative_humidity_2m) + '</b></div>' +
      '<div>Rüzgâr <b class="num">' + Math.round(c.wind_speed_10m) + '</b> km/sa</div>';
    // sonraki 5 gün
    var out = '', dayFmt = new Intl.DateTimeFormat('tr-TR', { timeZone: 'UTC', weekday: 'short' });
    for (var i = 1; i <= 5 && i < dy.time.length; i++) {
      var name = dayFmt.format(new Date(dy.time[i] + 'T12:00:00Z')).replace('.', '');
      var dw = wx(dy.weather_code[i], 1), pp = Math.round(Number(dy.precipitation_probability_max[i]) || 0);
      out += '<div class="d"><div class="dn">' + name + '</div><div class="e">' + dw[0] + '</div>' +
        '<div class="hi num">' + Math.round(dy.temperature_2m_max[i]) + '°</div>' +
        '<div class="lo num">' + Math.round(dy.temperature_2m_min[i]) + '°</div>' +
        '<div class="p num">' + (pp >= 30 ? '💧' + pp + '%' : '') + '</div></div>';
    }
    $('days').innerHTML = out;
  }
  function fetchWeather() {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
      '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m,is_day' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&timezone=Europe%2FIstanbul&forecast_days=6';
    return getJSON(url).then(function (d) { save('wx2', d); renderWeather(d); stamp('wx', true); })
      .catch(function () { stamp('wx', false); retryLater('wx', fetchWeather); });
  }

  /* ---------- Namaz ---------- */
  var NAMES = [['Fajr', 'İmsak'], ['Sunrise', 'Güneş'], ['Dhuhr', 'Öğle'], ['Asr', 'İkindi'], ['Maghrib', 'Akşam'], ['Isha', 'Yatsı']];
  var prayerData = null;
  function renderPrayers() {
    if (!prayerData) return;
    var p = istParts(), nowMin = p.h * 60 + p.m, nextIdx = -1, i;
    var mins = NAMES.map(function (n) { var s = prayerData.t[n[0]].slice(0, 5).split(':'); return +s[0] * 60 + +s[1]; });
    for (i = 0; i < mins.length; i++) if (mins[i] > nowMin) { nextIdx = i; break; }
    var html = '';
    NAMES.forEach(function (n, idx) {
      html += '<div class="pr' + (idx === nextIdx ? ' on' : '') + '"><div class="n">' + n[1] + '</div><div class="v num">' +
        prayerData.t[n[0]].slice(0, 5) + '</div></div>';
    });
    $('prayers').innerHTML = html;
    var diff, name;
    if (nextIdx >= 0) { diff = mins[nextIdx] - nowMin; name = NAMES[nextIdx][1]; }
    else { diff = 24 * 60 - nowMin + mins[0]; name = NAMES[0][1]; }
    var hh = Math.floor(diff / 60), mm = diff % 60;
    $('next').textContent = name + ' · ' + (hh ? hh + ' sa ' : '') + mm + ' dk';
  }
  // API'den gelen saatler HTML'e girmeden önce katı biçimle doğrulanır: yalnızca "SS:DD" kabul edilir.
  var TIME_RE = /^([01]\d|2[0-3]):[0-5]\d/;
  function cleanTimes(src) {
    if (!src) return null;
    var out = {};
    for (var i = 0; i < NAMES.length; i++) {
      var v = src[NAMES[i][0]];
      if (typeof v !== 'string' || !TIME_RE.test(v)) return null;
      out[NAMES[i][0]] = v.slice(0, 5);
    }
    return out;
  }
  function fetchPrayers() {
    var p = istParts(), ds = p.d + '-' + p.mo + '-' + p.y;
    if (prayerData && prayerData.date === ds) return Promise.resolve();
    var url = 'https://api.aladhan.com/v1/timings/' + ds + '?latitude=' + LAT + '&longitude=' + LON +
      '&method=13&timezonestring=' + encodeURIComponent(TZ);
    return getJSON(url).then(function (d) {
      var t = cleanTimes(d && d.data && d.data.timings);
      if (!t) throw new Error('geçersiz namaz verisi');
      prayerData = { date: ds, t: t };
      save('pr', prayerData); renderPrayers(); retryOk('pr');
    }).catch(function () { retryLater('pr', fetchPrayers); });
  }

  /* ---------- Piyasa ---------- */
  var MK = [['USD', 'Dolar', 2], ['EUR', 'Euro', 2], ['GRA', 'Gram altın', 0], ['CUMHURIYETALTINI', 'Cumhuriyet', 0]];
  function renderMarket(d) {
    var h = '';
    MK.forEach(function (m) {
      var x = d[m[0]]; if (!x) return;
      var ch = +x.Change, cls = ch > 0 ? 'up' : (ch < 0 ? 'down' : '');
      var arrow = ch > 0 ? '▲' : (ch < 0 ? '▼' : '');
      var val = m[2] ? trNum.format(x.Selling) : trInt.format(x.Selling);
      h += '<div class="m"><div class="n">' + m[1] + ' <span class="c num ' + cls + '">' + arrow + '%' + trNum.format(Math.abs(ch)) + '</span></div>' +
        '<div class="v num">' + val + ' ₺</div></div>';
    });
    $('mk').innerHTML = h;
  }
  function fetchMarket() {
    return getJSON('https://finans.truncgil.com/v4/today.json')
      .then(function (d) { save('mk', d); renderMarket(d); stamp('mk', true); })
      .catch(function () { stamp('mk', false); retryLater('mk', fetchMarket); });
  }

  /* ---------- Alt bilgi ---------- */
  var ok = { wx: true, mk: true };
  var lastOk = { wx: 0, mk: 0 };
  var retry = { wx: { n: 0, t: null }, mk: { n: 0, t: null }, pr: { n: 0, t: null } };
  // Hata sonrası 15 sn, 30 sn, 60 sn ... en çok 5 dk aralıkla yeniden dener.
  function retryLater(k, fn) { var r = retry[k]; clearTimeout(r.t); r.t = setTimeout(fn, Math.min(300000, 15000 * Math.pow(2, r.n++))); }
  function retryOk(k) { retry[k].n = 0; clearTimeout(retry[k].t); }
  function stamp(k, good) {
    ok[k] = good;
    if (good) { lastOk[k] = Date.now(); retryOk(k); }
    var p = istParts();
    $('foot').innerHTML = !(ok.wx && ok.mk) ? '<span class="stale">Bağlantı sorunu · eski veri gösteriliyor</span>' :
      'Güncellendi ' + pad(p.h) + ':' + pad(p.m);
  }

  /* ---------- Ekran açık kalsın ---------- */
  function keepAwake() {
    if ('wakeLock' in navigator && document.visibilityState === 'visible') {
      navigator.wakeLock.request('screen').catch(function () {});
    }
  }
  document.addEventListener('visibilitychange', function () {
    keepAwake();
    if (document.visibilityState !== 'visible') return;
    var now = Date.now();
    if (now - lastOk.wx > 5 * 60 * 1000) fetchWeather();
    if (now - lastOk.mk > 3 * 60 * 1000) fetchMarket();
    fetchPrayers();
  });
  window.addEventListener('online', function () { fetchWeather(); fetchMarket(); fetchPrayers(); });

  /* ---------- Tema düğmesi: Otomatik → Açık → Koyu ---------- */
  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById('toast'); t.textContent = msg; t.className = 'on';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = ''; }, 1400);
  }
  function cycleTheme() {
    themePref = THEMES[(THEMES.indexOf(themePref) + 1) % THEMES.length];
    try { localStorage.setItem('ep_tema', themePref); } catch (e) {}
    applyTheme();
    toast('Tema: ' + THEME_LABEL[themePref].slice(2));
  }
  document.getElementById('themeBtn').addEventListener('click', cycleTheme);
  document.querySelector('.clock').addEventListener('click', cycleTheme);   // büyük saat alanına dokunmak da temayı değiştirir

  /* ---------- Gerçek görünür yükseklik (--vh) ---------- */
  // Android Chrome'da 1vh, adres çubuğu gizliyken ölçülür; görünür alandan büyük olabilir. Bu yüzden innerHeight kullanılır.
  function setVh() { document.documentElement.style.setProperty('--vh', (window.innerHeight / 100) + 'px'); }
  setVh();
  window.addEventListener('resize', setVh);
  window.addEventListener('orientationchange', function () { setTimeout(setVh, 200); });

  /* ---------- Başlat ---------- */
  function boot() {
    var c;
    if ((c = load('wx2'))) renderWeather(c.v);
    if ((c = load('mk'))) renderMarket(c.v);
    if ((c = load('pr')) && c.v && cleanTimes(c.v.t)) { prayerData = { date: c.v.date, t: cleanTimes(c.v.t) }; }
    tick(); applyTheme();
    fetchWeather(); fetchMarket(); fetchPrayers();
    setInterval(tick, 1000);
    setInterval(fetchWeather, 15 * 60 * 1000);
    setInterval(fetchMarket, 5 * 60 * 1000);
    setInterval(fetchPrayers, 30 * 60 * 1000);
    keepAwake();
  }
  boot();
})();
</script>
</body>
</html>
