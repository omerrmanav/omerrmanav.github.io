<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ev Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --ink: #17160f;
    --ink-2: #57534a;
    --line: #e2ded3;
    --accent: #a8481f;
    --up: #1f7a45;
    --down: #b02a22;
    --hl: #f9e7dc;
  }
  :root[data-theme="dark"] {
    --bg: #0d0e11;
    --card: #17191d;
    --ink: #f3f2ee;
    --ink-2: #b4b2ab;
    --line: #2a2d33;
    --accent: #f0966a;
    --up: #6fcf95;
    --down: #ee7f78;
    --hl: #33231a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    color: var(--ink);
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    overflow: hidden;
  }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  main {
    height: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Saat */
  .clock { text-align: center; padding: 4px 0 0; }
  .time {
    font-size: clamp(64px, 21vw, 112px);
    font-weight: 300;
    letter-spacing: -0.045em;
    line-height: 1;
  }
  .date { margin-top: 6px; font-size: 17px; font-weight: 600; color: var(--ink-2); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 13px 16px;
    display: flex; flex-direction: column;
  }
  .label {
    font-size: 12.5px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-2); margin-bottom: 9px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .label small { font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 13px; }

  /* Hava */
  .wx-top { display: flex; align-items: center; gap: 12px; }
  .wx-icon { font-size: 46px; line-height: 1; }
  .wx-temp { font-size: 48px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .wx-desc { font-size: 15px; font-weight: 600; color: var(--ink-2); margin-top: 4px; }
  .wx-meta { margin-left: auto; text-align: right; font-size: 13.5px; font-weight: 500; color: var(--ink-2); line-height: 1.4; white-space: nowrap; }
  .wx-meta b { color: var(--ink); font-weight: 700; }
  .days { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); }
  .d { text-align: center; flex: 1; }
  .d .dn { font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .d .e { font-size: 24px; margin: 3px 0 2px; line-height: 1.1; }
  .d .hi { font-size: 16px; font-weight: 700; }
  .d .lo { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  .d .p { font-size: 11.5px; font-weight: 600; color: var(--accent); height: 14px; }

  /* Namaz */
  .next { font-size: 15px; color: var(--accent); font-weight: 700; text-transform: none; letter-spacing: 0; }
  .prayers { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; flex: 1; align-items: center; }
  .pr { text-align: center; padding: 8px 0 7px; border-radius: 12px; }
  .pr .n { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .pr .v { font-size: 15.5px; font-weight: 700; margin-top: 3px; letter-spacing: -0.02em; }
  .pr.on { background: var(--hl); }
  .pr.on .n { color: var(--accent); font-weight: 700; }

  /* Piyasa */
  .mk { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 12px; flex: 1; align-content: center; }
  .m .n { font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  .m .v { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
  .m .c { font-size: 13px; font-weight: 700; margin-left: 4px; }
  .up { color: var(--up); } .down { color: var(--down); }

  .footbar { position: relative; margin-top: auto; text-align: center; min-height: 20px; }
  .foot { font-size: 12px; font-weight: 600; color: var(--ink-2); line-height: 20px; }
  #themeBtn {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    font: inherit; font-size: 12px; font-weight: 700; color: var(--ink-2);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 10px; line-height: 16px; cursor: pointer; user-select: none;
  }
  #themeBtn:active { background: var(--hl); color: var(--accent); }
  #themeBtn:focus, #themeBtn:focus-visible { outline: none; }
  .clock { cursor: pointer; touch-action: manipulation; }
  #toast {
    position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); font-size: 16px; font-weight: 700;
    padding: 9px 20px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .2s; white-space: nowrap; z-index: 10;
  }
  #toast.on { opacity: .94; }
  #themeBtn::after { content: ""; position: absolute; inset: -8px -6px; }
  .stale { color: var(--down); }

  /* Kısa dikey ekran */
  @media (orientation: portrait) and (max-height: 700px) {
    main { gap: 8px; padding-top: 8px; padding-bottom: 8px; }
    .time { font-size: 64px; }
    .card { padding: 12px 14px; }
    .wx-icon, .wx-temp { font-size: 40px; }
  }

  /* Yatay ekran: iki sütun */
  @media (orientation: landscape) and (max-height: 600px) {
    main {
      max-width: none;
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas: "clock wx" "mkt prs" "foot foot";
      gap: 8px 10px;
      padding: max(8px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 4px max(14px, env(safe-area-inset-left));
    }
    .clock { grid-area: clock; display: flex; flex-direction: column; justify-content: center; padding: 0; min-height: 0; }
    #wx { grid-area: wx; } #prs { grid-area: prs; } #mkt { grid-area: mkt; }
    .footbar { grid-area: foot; margin: 0; min-height: 18px; }
    .foot { font-size: 11px; line-height: 18px; }
    #themeBtn { font-size: 11px; padding: 1px 9px; line-height: 15px; }
    .time { font-size: min(34vh, 15vw); }
    .date { margin-top: 2px; font-size: 16px; }
    .card { padding: 9px 13px; border-radius: 16px; min-height: 0; }
    .label { margin-bottom: 6px; font-size: 11.5px; }
    .label small { font-size: 12px; }
    .wx-top { gap: 10px; }
    .wx-icon { font-size: 36px; } .wx-temp { font-size: 38px; }
    .wx-desc { font-size: 13px; margin-top: 2px; }
    .wx-meta { font-size: 12.5px; line-height: 1.2; }
    .days { margin-top: 7px; padding-top: 6px; }
    .d .dn { font-size: 12px; } .d .e { font-size: 20px; margin: 2px 0 1px; }
    .d .hi { font-size: 15px; } .d .lo { font-size: 12.5px; } .d .p { display: none; }
    .next { font-size: 14px; }
    .pr { padding: 8px 0 7px; } .pr .n { font-size: 12.5px; } .pr .v { font-size: 17px; }
    .mk { gap: 4px 8px; align-content: space-around; }
    .m .n { font-size: 12.5px; }
    .m .v { font-size: 21px; margin-top: 1px; }
    .m .c { font-size: 12px; margin-left: 4px; }
  }
</style>
</head>
<body>
<main>
  <section class="clock">
    <div class="time num" id="time">--:--</div>
    <div class="date" id="date">&nbsp;</div>
  </section>

  <section class="card" id="wx">
    <div class="label"><span>Hava · Pendik</span><small id="wx-up">Open-Meteo.com</small></div>
    <div class="wx-top">
      <div class="wx-icon" id="wx-icon">·</div>
      <div>
        <div class="wx-temp num" id="wx-temp">--°</div>
        <div class="wx-desc" id="wx-desc"></div>
      </div>
      <div class="wx-meta" id="wx-meta"></div>
    </div>
    <div class="days" id="days"></div>
  </section>

  <section class="card" id="prs">
    <div class="label"><span>Namaz vakitleri</span><span class="next num" id="next"></span></div>
    <div class="prayers" id="prayers"></div>
  </section>

  <section class="card" id="mkt">
    <div class="label"><span>Piyasa</span><small>Truncgil · satış</small></div>
    <div class="mk" id="mk"></div>
  </section>

  <div id="toast" role="status"></div>
  <div class="footbar"><div class="foot num" id="foot"></div><button id="themeBtn" type="button" aria-label="Tema"></button></div>
</main>

<script>
(function () {
  'use strict';
  var TZ = 'Europe/Istanbul';
  var LAT = 40.875, LON = 29.233;   // Pendik

  /* ---------- Tema: açık öncelikli; ?tema=acik | koyu | oto ---------- */
  var params = new URLSearchParams(location.search);
  var THEMES = ['oto', 'acik', 'koyu'];
  var THEME_LABEL = { oto: '◐ Otomatik', acik: '☀ Açık', koyu: '☾ Koyu' };
  function storedTheme() { try { var v = localStorage.getItem('ep_tema'); return THEMES.indexOf(v) >= 0 ? v : null; } catch (e) { return null; } }
  var themePref = storedTheme() || (THEMES.indexOf(params.get('tema')) >= 0 ? params.get('tema') : 'oto');
  function applyTheme() {
    var dark = false;
    if (themePref === 'koyu') dark = true;
    else if (themePref === 'oto') { var h = istParts().h; dark = (h >= 22 || h < 7); }  // gece 22:00–07:00 koyu
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var b = document.getElementById('themeBtn'); if (b) b.textContent = THEME_LABEL[themePref];
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', dark ? '#0d0e11' : '#f5f3ee');
  }

  /* ---------- Yardımcılar ---------- */
  function istParts(d) {
    d = d || new Date();
    var f = new Intl.DateTimeFormat('tr-TR', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
      day: '2-digit', month: '2-digit', year: 'numeric' }).formatToParts(d);
    var o = {}; f.forEach(function (p) { o[p.type] = p.value; });
    return { h: +o.hour, m: +o.minute, d: o.day, mo: o.month, y: o.year };
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function $(id) { return document.getElementById(id); }
  function save(k, v) { try { localStorage.setItem('ep_' + k, JSON.stringify({ t: Date.now(), v: v })); } catch (e) {} }
  function load(k) { try { return JSON.parse(localStorage.getItem('ep_' + k)); } catch (e) { return null; } }
  function getJSON(url) {
    return new Promise(function (res, rej) {
      var ctl = ('AbortController' in window) ? new AbortController() : null;
      var to = setTimeout(function () { if (ctl) ctl.abort(); rej(new Error('timeout')); }, 15000);
      fetch(url, ctl ? { signal: ctl.signal } : {}).then(function (r) {
        clearTimeout(to);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(res, rej);
    });
  }
  var trNum = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var trInt = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 0 });

  /* ---------- Saat & tarih ---------- */
  var lastMin = -1;
  function tick() {
    var p = istParts();
    if (p.m !== lastMin) {
      lastMin = p.m;
      $('time').textContent = pad(p.h) + ':' + pad(p.m);
      $('date').textContent = new Intl.DateTimeFormat('tr-TR', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
      applyTheme();
      renderPrayers();
      if (p.h === 4 && p.m === 0) location.reload();   // günde bir tazele
    }
  }

  /* ---------- Hava ---------- */
  var WX = {
    0: ['☀️', 'Açık'], 1: ['🌤️', 'Çoğunlukla açık'], 2: ['⛅', 'Parçalı bulutlu'], 3: ['☁️', 'Kapalı'],
    45: ['🌫️', 'Sisli'], 48: ['🌫️', 'Kırağılı sis'],
    51: ['🌦️', 'Hafif çise'], 53: ['🌦️', 'Çise'], 55: ['🌧️', 'Yoğun çise'],
    56: ['🌧️', 'Donan çise'], 57: ['🌧️', 'Donan çise'],
    61: ['🌧️', 'Hafif yağmur'], 63: ['🌧️', 'Yağmur'], 65: ['🌧️', 'Kuvvetli yağmur'],
    66: ['🌧️', 'Donan yağmur'], 67: ['🌧️', 'Donan yağmur'],
    71: ['🌨️', 'Hafif kar'], 73: ['🌨️', 'Kar'], 75: ['❄️', 'Yoğun kar'], 77: ['🌨️', 'Kar taneleri'],
    80: ['🌦️', 'Sağanak'], 81: ['🌧️', 'Sağanak'], 82: ['⛈️', 'Şiddetli sağanak'],
    85: ['🌨️', 'Kar sağanağı'], 86: ['🌨️', 'Kar sağanağı'],
    95: ['⛈️', 'Gök gürültülü fırtına'], 96: ['⛈️', 'Dolu'], 99: ['⛈️', 'Şiddetli dolu']
  };
  function wx(code, isDay) {
    var w = WX[code] || ['·', ''];
    if (isDay === 0 && (code === 0 || code === 1)) return ['🌙', w[1]];
    return w;
  }
  function renderWeather(d) {
    if (!d || !d.current || !d.daily) return;
    var c = d.current, w = wx(c.weather_code, c.is_day), dy = d.daily;
    $('wx-icon').textContent = w[0];
    $('wx-temp').textContent = Math.round(c.temperature_2m) + '°';
    $('wx-desc').textContent = w[1];
    $('wx-meta').innerHTML =
      '<div><b class="num">↑' + Math.round(dy.temperature_2m_max[0]) + '°</b> <b class="num">↓' + Math.round(dy.temperature_2m_min[0]) + '°</b></div>' +
      '<div>Hissedilen <b class="num">' + Math.round(c.apparent_temperature) + '°</b></div>' +
      '<div>Nem <b class="num">%' + Math.round(c.relative_humidity_2m) + '</b></div>' +
      '<div>Rüzgâr <b class="num">' + Math.round(c.wind_speed_10m) + '</b> km/sa</div>';
    // sonraki 5 gün
    var out = '', dayFmt = new Intl.DateTimeFormat('tr-TR', { timeZone: 'UTC', weekday: 'short' });
    for (var i = 1; i <= 5 && i < dy.time.length; i++) {
      var name = dayFmt.format(new Date(dy.time[i] + 'T12:00:00Z')).replace('.', '');
      var dw = wx(dy.weather_code[i], 1), pp = Math.round(Number(dy.precipitation_probability_max[i]) || 0);
      out += '<div class="d"><div class="dn">' + name + '</div><div class="e">' + dw[0] + '</div>' +
        '<div class="hi num">' + Math.round(dy.temperature_2m_max[i]) + '°</div>' +
        '<div class="lo num">' + Math.round(dy.temperature_2m_min[i]) + '°</div>' +
        '<div class="p num">' + (pp >= 30 ? '💧' + pp + '%' : '') + '</div></div>';
    }
    $('days').innerHTML = out;
  }
  function fetchWeather() {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
      '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m,is_day' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&timezone=Europe%2FIstanbul&forecast_days=6';
    return getJSON(url).then(function (d) { save('wx2', d); renderWeather(d); stamp('wx', true); })
      .catch(function () { stamp('wx', false); });
  }

  /* ---------- Namaz ---------- */
  var NAMES = [['Fajr', 'İmsak'], ['Sunrise', 'Güneş'], ['Dhuhr', 'Öğle'], ['Asr', 'İkindi'], ['Maghrib', 'Akşam'], ['Isha', 'Yatsı']];
  var prayerData = null;
  function renderPrayers() {
    if (!prayerData) return;
    var p = istParts(), nowMin = p.h * 60 + p.m, nextIdx = -1, i;
    var mins = NAMES.map(function (n) { var s = prayerData.t[n[0]].slice(0, 5).split(':'); return +s[0] * 60 + +s[1]; });
    for (i = 0; i < mins.length; i++) if (mins[i] > nowMin) { nextIdx = i; break; }
    var html = '';
    NAMES.forEach(function (n, idx) {
      html += '<div class="pr' + (idx === nextIdx ? ' on' : '') + '"><div class="n">' + n[1] + '</div><div class="v num">' +
        prayerData.t[n[0]].slice(0, 5) + '</div></div>';
    });
    $('prayers').innerHTML = html;
    var diff, name;
    if (nextIdx >= 0) { diff = mins[nextIdx] - nowMin; name = NAMES[nextIdx][1]; }
    else { diff = 24 * 60 - nowMin + mins[0]; name = NAMES[0][1]; }
    var hh = Math.floor(diff / 60), mm = diff % 60;
    $('next').textContent = name + ' · ' + (hh ? hh + ' sa ' : '') + mm + ' dk';
  }
  // API'den gelen saatler HTML'e girmeden önce katı biçimle doğrulanır: yalnızca "SS:DD" kabul edilir.
  var TIME_RE = /^([01]\d|2[0-3]):[0-5]\d/;
  function cleanTimes(src) {
    if (!src) return null;
    var out = {};
    for (var i = 0; i < NAMES.length; i++) {
      var v = src[NAMES[i][0]];
      if (typeof v !== 'string' || !TIME_RE.test(v)) return null;
      out[NAMES[i][0]] = v.slice(0, 5);
    }
    return out;
  }
  function fetchPrayers() {
    var p = istParts(), ds = p.d + '-' + p.mo + '-' + p.y;
    if (prayerData && prayerData.date === ds) return Promise.resolve();
    var url = 'https://api.aladhan.com/v1/timings/' + ds + '?latitude=' + LAT + '&longitude=' + LON +
      '&method=13&timezonestring=' + encodeURIComponent(TZ);
    return getJSON(url).then(function (d) {
      var t = cleanTimes(d && d.data && d.data.timings);
      if (!t) throw new Error('geçersiz namaz verisi');
      prayerData = { date: ds, t: t };
      save('pr', prayerData); renderPrayers();
    }).catch(function () {});
  }

  /* ---------- Piyasa ---------- */
  var MK = [['USD', 'Dolar', 2], ['EUR', 'Euro', 2], ['GRA', 'Gram altın', 0], ['CUMHURIYETALTINI', 'Cumhuriyet', 0]];
  function renderMarket(d) {
    var h = '';
    MK.forEach(function (m) {
      var x = d[m[0]]; if (!x) return;
      var ch = +x.Change, cls = ch > 0 ? 'up' : (ch < 0 ? 'down' : '');
      var arrow = ch > 0 ? '▲' : (ch < 0 ? '▼' : '');
      var val = m[2] ? trNum.format(x.Selling) : trInt.format(x.Selling);
      h += '<div class="m"><div class="n">' + m[1] + ' <span class="c num ' + cls + '">' + arrow + '%' + trNum.format(Math.abs(ch)) + '</span></div>' +
        '<div class="v num">' + val + ' ₺</div></div>';
    });
    $('mk').innerHTML = h;
  }
  function fetchMarket() {
    return getJSON('https://finans.truncgil.com/v4/today.json')
      .then(function (d) { save('mk', d); renderMarket(d); stamp('mk', true); })
      .catch(function () { stamp('mk', false); });
  }

  /* ---------- Alt bilgi ---------- */
  var ok = { wx: true, mk: true };
  function stamp(k, good) {
    ok[k] = good;
    var p = istParts();
    $('foot').innerHTML = !(ok.wx && ok.mk) ? '<span class="stale">Bağlantı sorunu · eski veri gösteriliyor</span>' :
      'Güncellendi ' + pad(p.h) + ':' + pad(p.m);
  }

  /* ---------- Ekran açık kalsın ---------- */
  function keepAwake() {
    if ('wakeLock' in navigator && document.visibilityState === 'visible') {
      navigator.wakeLock.request('screen').catch(function () {});
    }
  }
  document.addEventListener('visibilitychange', keepAwake);

  /* ---------- Tema düğmesi: Otomatik → Açık → Koyu ---------- */
  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById('toast'); t.textContent = msg; t.className = 'on';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = ''; }, 1400);
  }
  function cycleTheme() {
    themePref = THEMES[(THEMES.indexOf(themePref) + 1) % THEMES.length];
    try { localStorage.setItem('ep_tema', themePref); } catch (e) {}
    applyTheme();
    toast('Tema: ' + THEME_LABEL[themePref].slice(2));
  }
  document.getElementById('themeBtn').addEventListener('click', cycleTheme);
  document.querySelector('.clock').addEventListener('click', cycleTheme);   // büyük saat alanına dokunmak da temayı değiştirir

  /* ---------- Başlat ---------- */
  function boot() {
    var c;
    if ((c = load('wx2'))) renderWeather(c.v);
    if ((c = load('mk'))) renderMarket(c.v);
    if ((c = load('pr')) && c.v && cleanTimes(c.v.t)) { prayerData = { date: c.v.date, t: cleanTimes(c.v.t) }; }
    tick(); applyTheme();
    fetchWeather(); fetchMarket(); fetchPrayers();
    setInterval(tick, 1000);
    setInterval(fetchWeather, 15 * 60 * 1000);
    setInterval(fetchMarket, 5 * 60 * 1000);
    setInterval(fetchPrayers, 30 * 60 * 1000);
    keepAwake();
  }
  boot();
})();
</script>
